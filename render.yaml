# Render Blueprint — free, no credit card. worker + api (+ telegram) run in
# one free web service (Dockerfile.allinone). Postgres lives elsewhere
# (Supabase free) because Render's free Postgres is deleted after 30 days.
# See DEPLOY.md → "Backend — Render + Supabase".
services:
  - type: web
    name: crypto-signal
    runtime: docker
    plan: free
    # NOT a US region: Binance answers US IPs with 451 "restricted location".
    region: singapore
    dockerfilePath: ./Dockerfile.allinone
    dockerContext: .
    # Liveness only. Never /health — it goes 503 when Binance is unhappy,
    # and Render would then time the deploy out (see DEPLOY.md).
    healthCheckPath: /livez
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALERT_CHAT_IDS
        sync: false
      # Vercel dashboard URL; enables the "Xem chart" link under /lookup.
      - key: WEB_BASE_URL
        sync: false
      # Small-cap scanner (/gems). The code default is already on; listed so
      # the Blueprint shows it and turning it off is one edit here.
      - key: GEM_SCAN_ENABLED
        value: "true"
      - key: GEM_CHAINS
        value: solana
